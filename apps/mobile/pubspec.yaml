name: nyla
description: Private, local-first menstrual health companion.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cycle_engine:
    path: ../../packages/cycle_engine
  sync_core:
    path: ../../packages/sync_core
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  drift: 2.32.1
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  http: ^1.6.0
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqlite3: ^3.5.0
  timezone: ^0.11.1

dev_dependencies:
  build_runner: 2.10.5
  drift_dev: 2.32.1
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
