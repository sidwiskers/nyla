name: nyla
description: Private, local-first menstrual health companion.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cycle_engine:
    path: ../../packages/cycle_engine
  sync_core:
    path: ../../packages/sync_core
  health_content:
    path: ../../content/tips
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  drift: 2.34.3
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  http: ^1.6.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  sqlite3: ^3.5.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  workmanager: ^0.10.7

dev_dependencies:
  build_runner: 2.10.5
  drift_dev: 2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: NylaSans
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: NylaDisplay
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/nyla_app_icon.png
  adaptive_icon_background: "#FFF8F4"
  adaptive_icon_foreground: assets/branding/nyla_app_icon_foreground.png
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  background_color_ios: "#FFF8F4"

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
