<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="nylaBackground" cx="0.16" cy="0.10" r="1.15">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="0.56" stop-color="#FBF6F5"/>
      <stop offset="1" stop-color="#F3EBF1"/>
    </radialGradient>
    <linearGradient id="nylaBack" x1="0.35" y1="0.15" x2="0.78" y2="0.95">
      <stop offset="0" stop-color="#816085"/>
      <stop offset="0.50" stop-color="#9C6B86"/>
      <stop offset="1" stop-color="#C07C91"/>
    </linearGradient>
    <linearGradient id="nylaFront" x1="0.10" y1="0.08" x2="0.80" y2="0.86">
      <stop offset="0" stop-color="#35253F"/>
      <stop offset="0.50" stop-color="#52365E"/>
      <stop offset="1" stop-color="#775177"/>
    </linearGradient>
    <filter id="nylaShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="16" result="offset"/>
      <feColorMatrix
        in="offset"
        type="matrix"
        values="0 0 0 0 0.15  0 0 0 0 0.09  0 0 0 0 0.17  0 0 0 0.16 0"
      />
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#nylaBackground)"/>

  <!--
    The Nyla Fold is a restrained woven N: one continuous soft form with a
    deliberate overlap. It is a monogram without typography, and avoids the
    flower, droplet, heart, calendar and uterus motifs common to health apps.
  -->
  <g
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#nylaShadow)"
  >
    <path
      d="M350 686 C322 586 324 420 370 338 L655 686 C706 630 722 438 690 338"
      stroke="url(#nylaBack)"
      stroke-width="136"
    />
    <path
      d="M350 686 C322 586 324 420 370 338 L568 579"
      stroke="url(#nylaFront)"
      stroke-width="136"
    />
  </g>
</svg>
