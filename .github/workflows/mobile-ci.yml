name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'content/tips/**'
      - 'services/sync/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'content/tips/**'
      - 'services/sync/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Generate pinned platform scaffolds
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --org app.nyla \
            --project-name nyla \
            --platforms=android,ios \
            "$RUNNER_TEMP/nyla-platform"
          cp -R "$RUNNER_TEMP/nyla-platform/android" apps/mobile/
          cp -R "$RUNNER_TEMP/nyla-platform/ios" apps/mobile/
          cp "$RUNNER_TEMP/nyla-platform/.metadata" apps/mobile/.metadata
          python3 apps/mobile/tool/configure_platforms.py

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze app
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos

      - name: Run app tests
        working-directory: apps/mobile
        run: flutter test

      - name: Test cycle engine
        working-directory: packages/cycle_engine
        run: dart test

      - name: Test sync core
        working-directory: packages/sync_core
        run: dart test

      - name: Validate health content
        working-directory: content/tips
        run: dart test

      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug

  sync-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/sync
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
