name: Generate Android Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate permanent Nyla signing keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Add these Repository Secrets first: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate password-protected release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          keystore='dist/nyla-release.jks'

          keytool -genkeypair \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname 'CN=Nyla, OU=Nyla, O=Nyla, L=Private, ST=Private, C=IN' \
            -noprompt

          keytool -list \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          base64 -w 0 "$keystore" > 'dist/nyla-release.jks.base64.txt'
          printf '\n' >> 'dist/nyla-release.jks.base64.txt'
          sha256sum "$keystore" > 'dist/nyla-release.jks.sha256'

      - name: Upload one-time signing bundle
        uses: actions/upload-artifact@v7
        with:
          name: nyla-android-signing-bootstrap
          path: |
            dist/nyla-release.jks
            dist/nyla-release.jks.base64.txt
            dist/nyla-release.jks.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Next step
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Keystore created

          1. Download the `nyla-android-signing-bootstrap` artifact.
          2. Open `nyla-release.jks.base64.txt` and copy its entire single line into the Repository Secret `ANDROID_KEYSTORE_BASE64`.
          3. Keep `nyla-release.jks` somewhere private as an emergency backup.
          4. Delete this workflow run after the secret and backup are safely stored.
          5. Never generate a replacement after distributing a Nyla APK signed with this key.
          EOF
